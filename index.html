<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#eef1ff;font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;background:#0a0c1a;
background-image:radial-gradient(60vw 50vh at 10% 0,#5a2a6b66,transparent),radial-gradient(50vw 50vh at 100% 20%,#1d4f7a66,transparent),radial-gradient(50vw 40vh at 30% 100%,#7a2a4a55,transparent);background-attachment:fixed;padding:max(16px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:900px;margin:auto;display:grid;gap:14px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-radius:22px;padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 30px rgba(0,0,0,.3)}
header{display:flex;gap:14px;align-items:center}
header img{width:64px;height:64px;border-radius:18px;border:1px solid rgba(255,255,255,.3)}
h1{margin:0;font-size:22px}header p{margin:2px 0 0;font-size:13px;opacity:.7}
h3{margin:0 0 10px;font-size:15px}
#drop{border:2px dashed rgba(255,255,255,.3);text-align:center;padding:26px 12px;cursor:pointer;transition:.2s}
#drop.on,#drop:hover{border-color:#ff7b9c;background:rgba(255,123,156,.1)}
#drop small{display:block;opacity:.65;margin-top:6px}
canvas{width:100%;height:150px;display:block;border-radius:14px;background:rgba(0,0,0,.3);touch-action:none;cursor:ew-resize}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;color:#fff;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);padding:9px 15px;border-radius:14px;cursor:pointer}
button:hover{background:rgba(255,255,255,.2)}button:focus-visible,input:focus-visible{outline:2px solid #8fd3ff;outline-offset:2px}
button.main{background:linear-gradient(135deg,#ff6b8b,#b66bff);border:0;font-weight:700}
button.sel{background:#8fd3ff33;border-color:#8fd3ff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.ctl{display:grid;grid-template-columns:92px 1fr 62px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.ctl output{text-align:right;opacity:.8;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:#ff7b9c}
#st{font-size:13px;opacity:.8;min-height:18px}
footer{text-align:center;font-size:13px;opacity:.75;padding:6px}
.hide{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const CFG=[
['カット（残す範囲）',[['ts','開始',0,1,.01,0,'秒'],['te','終了',0,1,.01,1,'秒']]],
['音量',[['gain','全体の音量',-12,12,.5,0,'dB'],['fi','フェードイン',0,6,.1,0,'秒'],['fo','フェードアウト',0,6,.1,0,'秒']]],
['音量差（強調区間）',[['bs','区間の開始',0,1,.01,0,'秒'],['be','区間の終了',0,1,.01,0,'秒'],['bdb','区間の音量差',-24,12,.5,6,'dB']]],
['整音（EQ・コンプ）',[['hpf','低音カット',20,400,5,80,'Hz'],['low','低音の厚み',-12,12,.5,0,'dB'],['mid','声の芯',-12,12,.5,0,'dB'],['high','高音の抜け',-12,12,.5,0,'dB'],['th','コンプ強さ',-60,0,1,-18,'dB'],['ratio','圧縮比',1,20,.5,3,':1'],['mk','聞こえ補正',0,18,.5,0,'dB']]],
['空間（Doubler・BigRoom）',[['dbl','Doubler',0,1,.01,0,''],['room','BigRoom',0,1,.01,0,''],['size','部屋の大きさ',.5,6,.1,2.2,'秒'],['echo','エコー',0,1,.01,0,''],['echoT','エコー間隔',.05,1,.01,.28,'秒']]]
];
const P={},DEF={},FIXED=['ts','te','bs','be','bdb'];
CFG.forEach(([,l])=>l.forEach(c=>{P[c[0]]=DEF[c[0]]=c[5]}));
const PRESETS={
'リセット':{},
'クリアボイス':{hpf:100,mid:2,high:3,th:-22,ratio:3,mk:4},
'歌ってみた':{hpf:90,mid:1,high:3,th:-20,ratio:3,mk:3,dbl:.35,room:.22,size:2,echo:.12,echoT:.3},
'Doubler':{dbl:.75,high:2,th:-18,ratio:3,mk:3},
'BigRoom':{low:2,high:2,room:.55,size:4.5,dbl:.4,echo:.2,th:-20,mk:2},
'配信ボイス':{hpf:120,low:-1,mid:3,high:2,th:-24,ratio:4,mk:6}
};
let buf,trimmed,out,peaks,useFx=true,timer,ac,node,t0,playing=false,name='audio';

// ---- UI生成 ----
const pan=$('#panels');
CFG.forEach(([title,list])=>{
 const d=document.createElement('section');d.className='card';d.innerHTML='<h3>'+title+'</h3>';
 list.forEach(([id,lb,mn,mx,st,df,u])=>{
  const r=document.createElement('div');r.className='ctl';
  r.innerHTML=`<label for="${id}">${lb}</label><input type="range" id="${id}" min="${mn}" max="${mx}" step="${st}" value="${df}"><output id="o_${id}"></output>`;
  d.appendChild(r);
  r.querySelector('input').oninput=e=>{P[id]=+e.target.value;show(id);schedule()};
 });
 pan.appendChild(d);
});
const UNIT={};CFG.forEach(([,l])=>l.forEach(c=>UNIT[c[0]]=c[6]));
function show(id){const v=P[id];$('#o_'+id).textContent=(Math.abs(v)<10&&v%1?v.toFixed(2).replace(/0$/,''):v)+UNIT[id]}
function setVal(id,v){P[id]=v;$('#'+id).value=v;show(id)}
Object.keys(P).forEach(show);
const pr=$('#pr');
Object.entries(PRESETS).forEach(([n,v])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{
 Object.keys(DEF).filter(k=>!FIXED.includes(k)).forEach(k=>setVal(k,v[k]!==undefined?v[k]:DEF[k]));schedule()};pr.appendChild(b)});

// ---- 読み込み ----
const drop=$('#drop');
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',e=>{if(e.dataTransfer.files[0])load(e.dataTransfer.files[0])});
$('#file').onchange=e=>{if(e.target.files[0])load(e.target.files[0])};
async function load(f){
 stop();status('読み込み中…');$('#fname').textContent=f.name;name=f.name.replace(/\.[^.]+$/,'')||'audio';
 try{buf=await decodeFile(f)}
  catch(e1){
   status('通常の読み込みに失敗。再生しながら取り込みます…');
   try{buf=await viaPlayback(f)}catch(e2){status('読み込めませんでした：'+(e2&&e2.message||e2)+'（別の形式やmp4・mp3・wavを試してください）');return}
  }
 const d=+buf.duration.toFixed(2);
 ['ts','te','bs','be'].forEach(id=>{$('#'+id).max=d});
 setVal('ts',0);setVal('te',d);setVal('bs',0);setVal('be',0);
 const ch=buf.getChannelData(0),N=1000,step=Math.max(1,Math.floor(ch.length/N));peaks=[];
 for(let i=0;i<N;i++){let mx=0;const a=i*step;for(let j=a;j<a+step&&j<ch.length;j+=Math.max(1,step>>6))mx=Math.max(mx,Math.abs(ch[j]));peaks.push(mx)}
 ['studio','presets','panels','exp'].forEach(i=>$('#'+i).classList.remove('hide'));
 schedule(0);
}
const AC=window.AudioContext||window.webkitAudioContext;
async function decodeFile(f){
 const ab=await f.arrayBuffer(),c=new AC();
 try{return await new Promise((res,rej)=>{const p=c.decodeAudioData(ab,res,rej);if(p&&p.catch)p.catch(rej)})}finally{c.close()}
}
function viaPlayback(f){
 return new Promise((resolve,reject)=>{
  const v=document.createElement('video');v.src=URL.createObjectURL(f);v.playsInline=true;v.preload='auto';
  v.onerror=()=>reject(new Error('この端末では再生できない形式です'));
  v.onloadedmetadata=async()=>{
   try{
    const c=new AC();await c.resume();const s=c.createMediaElementSource(v),d=c.createMediaStreamDestination();s.connect(d);
    const rec=new MediaRecorder(d.stream),ch=[];rec.ondataavailable=e=>ch.push(e.data);
    rec.onstop=async()=>{try{resolve(await decodeFile(new Blob(ch,{type:rec.mimeType})))}catch(e){reject(e)}c.close()};
    v.onended=()=>rec.stop();
    v.ontimeupdate=()=>status('取り込み中… '+Math.floor(v.currentTime)+' / '+Math.floor(v.duration||0)+'秒（再生しながら録音しています）');
    rec.start();await v.play();
   }catch(e){reject(e)}
  };
 });
}
function status(t){$('#st').textContent=t}

// ---- エフェクトチェーン ----
function ir(ctx,sec){
 const sr=ctx.sampleRate,n=Math.floor(sr*sec),b=ctx.createBuffer(2,n,sr);
 for(let c=0;c<2;c++){const d=b.getChannelData(c);let lp=0;
  for(let i=0;i<n;i++){const t=i/n;lp+=((Math.random()*2-1)-lp)*(.55-.4*t);d[i]=lp*Math.pow(1-t,2.6)*(i<sr*.004?i/(sr*.004):1)*1.6}}
 return b;
}
function par(ctx,inp,amt,build){
 if(amt<.005)return inp;
 const o=ctx.createGain(),w=ctx.createGain();w.gain.value=amt;inp.connect(o);build(inp,w);w.connect(o);return o;
}
const dB=x=>Math.pow(10,x/20);
function chain(ctx,src,dur){
 let n=src;const add=x=>{n.connect(x);n=x;return x};
 const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=P.hpf;f.Q.value=.7;add(f);
 [['lowshelf',120,P.low],['peaking',2500,P.mid],['highshelf',8000,P.high]].forEach(([t,fr,g])=>{
  const e=ctx.createBiquadFilter();e.type=t;e.frequency.value=fr;e.gain.value=g;if(t=='peaking')e.Q.value=.9;add(e)});
 const cp=ctx.createDynamicsCompressor();cp.threshold.value=P.th;cp.ratio.value=P.ratio;cp.knee.value=10;cp.attack.value=.005;cp.release.value=.16;add(cp);
 const mk=ctx.createGain();mk.gain.value=dB(P.mk);add(mk);
 n=par(ctx,n,P.dbl,(i,w)=>[[.017,-.85,.31],[.029,.85,.23]].forEach(([t,p,r])=>{
  const d=ctx.createDelay(.1);d.delayTime.value=t;const l=ctx.createOscillator();l.frequency.value=r;
  const lg=ctx.createGain();lg.gain.value=.0018;l.connect(lg);lg.connect(d.delayTime);l.start();
  const sp=ctx.createStereoPanner();sp.pan.value=p;i.connect(d);d.connect(sp);sp.connect(w)}));
 n=par(ctx,n,P.echo,(i,w)=>{const d=ctx.createDelay(2),fb=ctx.createGain();d.delayTime.value=P.echoT;fb.gain.value=.38;
  i.connect(d);d.connect(fb);fb.connect(d);d.connect(w)});
 n=par(ctx,n,P.room*1.4,(i,w)=>{const c=ctx.createConvolver();c.buffer=ir(ctx,P.size);i.connect(c);c.connect(w)});
 const bo=ctx.createGain(),br=Math.max(0,P.bs-P.ts),er=Math.min(dur,P.be-P.ts);
 bo.gain.setValueAtTime(1,0);
 if(er>br+.1){const g=dB(P.bdb);bo.gain.linearRampToValueAtTime(1,br);bo.gain.linearRampToValueAtTime(g,br+.04);bo.gain.setValueAtTime(g,er);bo.gain.linearRampToValueAtTime(1,er+.04)}
 add(bo);
 const gn=ctx.createGain();gn.gain.value=dB(P.gain);add(gn);
 const fd=ctx.createGain();fd.gain.setValueAtTime(P.fi>0?0:1,0);
 if(P.fi>0)fd.gain.linearRampToValueAtTime(1,P.fi);
 if(P.fo>0){fd.gain.setValueAtTime(1,Math.max(P.fi,dur-P.fo));fd.gain.linearRampToValueAtTime(0,dur)}
 add(fd);
 const lm=ctx.createDynamicsCompressor();lm.threshold.value=-1;lm.ratio.value=20;lm.knee.value=0;lm.attack.value=.001;lm.release.value=.05;add(lm);
 return n;
}
function slice(){
 const sr=buf.sampleRate,a=Math.floor(P.ts*sr),b=Math.min(buf.length,Math.floor(P.te*sr));
 if(b-a<sr*.05)return null;
 const nc=Math.min(2,buf.numberOfChannels),o=new AudioBuffer({length:b-a,numberOfChannels:nc,sampleRate:sr});
 for(let c=0;c<nc;c++)o.copyToChannel(buf.getChannelData(c).subarray(a,b),c);
 return o;
}
function schedule(ms=350){clearTimeout(timer);status('処理中…');draw();timer=setTimeout(render,ms)}
async function render(){
 if(!buf)return;const s=slice();if(!s){status('カット範囲が短すぎます');return}
 try{
  const tail=(P.room>0?P.size:0)+(P.echo>0?1.5:0),len=s.length+Math.ceil(tail*s.sampleRate);
  const oc=new OfflineAudioContext(2,len,s.sampleRate),src=oc.createBufferSource();
  src.buffer=s;chain(oc,src,s.duration).connect(oc.destination);src.start();
  const r=await oc.startRendering();
  if($('#norm').checked){let pk=0;for(let c=0;c<r.numberOfChannels;c++){const d=r.getChannelData(c);for(let i=0;i<d.length;i++)pk=Math.max(pk,Math.abs(d[i]))}
   if(pk>0){const g=.89/pk;for(let c=0;c<r.numberOfChannels;c++){const d=r.getChannelData(c);for(let i=0;i<d.length;i++)d[i]*=g}}}
  trimmed=s;out=r;status('準備完了（'+r.duration.toFixed(1)+'秒）');
 }catch(e){status('処理に失敗しました：'+e.message)}
}
$('#norm').onchange=()=>schedule(0);

// ---- 再生 ----
function stop(){if(node){node.onended=null;try{node.stop()}catch(e){}node=null}playing=false;$('#play').textContent='▶ 再生'}
$('#play').onclick=()=>{
 if(playing){stop();draw();return}
 const b=useFx?out:trimmed;if(!b)return;
 ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();
 node=ac.createBufferSource();node.buffer=b;node.connect(ac.destination);
 node.onended=()=>{stop();draw()};node.start();t0=ac.currentTime;playing=true;$('#play').textContent='■ 停止';loop();
};
function loop(){draw();if(playing)requestAnimationFrame(loop)}
function ab(fx){useFx=fx;$('#bFx').classList.toggle('sel',fx);$('#bOr').classList.toggle('sel',!fx);if(playing){stop();$('#play').click()}}
$('#bFx').onclick=()=>ab(true);$('#bOr').onclick=()=>ab(false);

// ---- 波形 ----
const cv=$('#wv'),g=cv.getContext('2d');
function draw(){
 if(!peaks)return;const dpr=devicePixelRatio||1,W=cv.clientWidth*dpr,H=cv.clientHeight*dpr;
 if(cv.width!=W){cv.width=W;cv.height=H}
 g.clearRect(0,0,W,H);const D=buf.duration,x=t=>t/D*W;
 g.fillStyle='#ffffff55';const bw=W/peaks.length;
 peaks.forEach((p,i)=>{const h=Math.max(1,p*H*.9);g.fillRect(i*bw,(H-h)/2,Math.max(1,bw-.5),h)});
 if(P.be>P.bs){g.fillStyle='#8fd3ff44';g.fillRect(x(P.bs),0,x(P.be)-x(P.bs),H)}
 g.fillStyle='#0009';g.fillRect(0,0,x(P.ts),H);g.fillRect(x(P.te),0,W-x(P.te),H);
 g.fillStyle='#ff7b9c';[P.ts,P.te].forEach(t=>g.fillRect(x(t)-2*dpr,0,4*dpr,H));
 if(playing){g.fillStyle='#fff';g.fillRect(x(P.ts+ac.currentTime-t0),0,2*dpr,H)}
}
addEventListener('resize',draw);
let drag=null;
cv.onpointerdown=e=>{if(!buf)return;cv.setPointerCapture(e.pointerId);const t=tm(e);drag=Math.abs(t-P.ts)<Math.abs(t-P.te)?'ts':'te';mv(e)};
cv.onpointermove=e=>{if(drag)mv(e)};cv.onpointerup=()=>drag=null;
function tm(e){const r=cv.getBoundingClientRect();return Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*buf.duration}
function mv(e){let t=+tm(e).toFixed(2);if(drag=='ts')t=Math.min(t,P.te-.1);else t=Math.max(t,P.ts+.1);setVal(drag,Math.max(0,t));schedule()}

// ---- 書き出し ----
function save(blob,ext){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'_fx.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function i16(f){const o=new Int16Array(f.length);for(let i=0;i<f.length;i++){const s=Math.max(-1,Math.min(1,f[i]));o[i]=s<0?s*32768:s*32767}return o}
$('#wavb').onclick=()=>{
 if(!out)return;const n=out.length,ch=2,v=new DataView(new ArrayBuffer(44+n*4)),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
 w(0,'RIFF');v.setUint32(4,36+n*4,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
 v.setUint32(24,out.sampleRate,true);v.setUint32(28,out.sampleRate*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*4,true);
 const L=i16(out.getChannelData(0)),R=i16(out.getChannelData(Math.min(1,out.numberOfChannels-1)));
 for(let i=0;i<n;i++){v.setInt16(44+i*4,L[i],true);v.setInt16(46+i*4,R[i],true)}
 save(new Blob([v],{type:'audio/wav'}),'wav');
};
$('#mp3').onclick=()=>{
 if(!out)return;if(typeof lamejs==='undefined'){status('MP3エンコーダを読み込めませんでした（オンライン接続が必要）。WAVで保存してください');return}
 status('MP3に変換中…');
 setTimeout(()=>{
  const e=new lamejs.Mp3Encoder(2,out.sampleRate,192),L=i16(out.getChannelData(0)),R=i16(out.getChannelData(Math.min(1,out.numberOfChannels-1))),parts=[];
  for(let i=0;i<L.length;i+=1152){const b=e.encodeBuffer(L.subarray(i,i+1152),R.subarray(i,i+1152));if(b.length)parts.push(new Uint8Array(b))}
  const f=e.flush();if(f.length)parts.push(new Uint8Array(f));
  save(new Blob(parts,{type:'audio/mpeg'}),'mp3');status('MP3を書き出しました');
 },30);
};
</script>
